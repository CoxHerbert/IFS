# Copy this file to /etc/nginx/conf.d/ifs.conf and adjust domain names/TLS
# certificate paths to match the deployment environment.

upstream ifs_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name admin.baozenan.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.baozenan.online;

    ssl_certificate     /etc/nginx/ssl/admin.baozenan.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.baozenan.online/privkey.pem;

    root /data/www/ifs-admin;
    index index.html;
    client_max_body_size 50m;

    location ^~ /admin-api/ {
        proxy_pass http://ifs_api/;
        include /etc/nginx/proxy_params;
    }

    location ^~ /profile/ {
        proxy_pass http://ifs_api;
        include /etc/nginx/proxy_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}

server {
    listen 80;
    server_name baozenan.online www.baozenan.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name baozenan.online www.baozenan.online;

    ssl_certificate     /etc/nginx/ssl/baozenan.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/baozenan.online/privkey.pem;

    root /data/www/ifs-portal;
    index index.html;
    client_max_body_size 50m;

    location ^~ /portal-api/ {
        proxy_pass http://ifs_api/portal/;
        include /etc/nginx/proxy_params;
    }

    location ^~ /profile/ {
        proxy_pass http://ifs_api;
        include /etc/nginx/proxy_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}

server {
    listen 80;
    server_name ledger.baozenan.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ledger.baozenan.online;

    ssl_certificate     /etc/nginx/ssl/ledger.baozenan.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ledger.baozenan.online/privkey.pem;

    root /data/www/ifs-ledger;
    index index.html;
    client_max_body_size 50m;

    location ^~ /ledger-api/ {
        proxy_pass http://ifs_api/;
        include /etc/nginx/proxy_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# API host is optional; include it when api.baozenan.online points at this server.
server {
    listen 80;
    server_name api.baozenan.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.baozenan.online;

    ssl_certificate     /etc/nginx/ssl/api.baozenan.online/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/api.baozenan.online/privkey.pem;
    client_max_body_size 50m;

    location ^~ /admin-api/ {
        proxy_pass http://ifs_api/;
        include /etc/nginx/proxy_params;
    }

    location ^~ /portal-api/ {
        proxy_pass http://ifs_api/portal/;
        include /etc/nginx/proxy_params;
    }

    location ^~ /profile/ {
        proxy_pass http://ifs_api;
        include /etc/nginx/proxy_params;
    }

    location / {
        return 404;
    }
}
