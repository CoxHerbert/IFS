server {
    listen 80;
    server_name ledger.baozenan.online;

    location ^~ /.well-known/acme-challenge/ {
        root /data/www/ifs-ledger;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ledger.baozenan.online;

    ssl_certificate /etc/letsencrypt/live/ledger.baozenan.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ledger.baozenan.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /data/www/ifs-ledger;
    index index.html;
    client_max_body_size 50m;

    location ^~ /ledger-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}
